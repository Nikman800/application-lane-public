name: Bug report
description: Something filled wrong, did not work, or looked broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please do not paste personal data** anywhere in this issue:
        no résumé, profile contents, `config.json`, pairing token, API keys, application answers,
        names, emails or phone numbers. Issue reports and recordings saved by the extension contain
        the values you entered, so do not attach them unless you have removed personal details.
        Screenshots are welcome if personal details are blurred.

        Security problems: please use a private advisory instead (Security tab → Report a vulnerability).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Track the application at …
        2. Choose Fill this step on the second page
        3. The "Degree" dropdown stays empty
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site or applicant tracking system
      description: For example Workday, Greenhouse, Lever, Ashby, iCIMS, or the employer's own site. A public posting link is helpful if the job is still open.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Windows 11 + WSL / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v22.x
  - type: input
    id: build
    attributes:
      label: Extension build
      description: Shown under Dashboard → Settings → Backend connection ("This extension was built …"), or the release version.
  - type: dropdown
    id: provider
    attributes:
      label: Drafting provider (if relevant)
      options:
        - Not relevant
        - None
        - Claude Code CLI
        - Codex CLI
        - OpenAI-compatible API
  - type: textarea
    id: logs
    attributes:
      label: Error messages
      description: Messages from the side panel or the backend's terminal, with personal details removed.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included personal data, tokens or API keys.
          required: true
